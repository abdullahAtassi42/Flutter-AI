name: flutter_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Federo
      fonts:
        - asset: assets/fonts/Federo-Regular.ttf
          weight: 400
    - family: Monoton
      fonts:
        - asset: assets/fonts/Monoton-Regular.ttf
          weight: 400